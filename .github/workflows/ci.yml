name: ci

on:
  push:
    branches: [ "master", "feature/commerce" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Commerce.slnx

      - name: Build
        run: dotnet build Commerce.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Commerce.slnx --no-build -c Release --verbosity normal

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the Compose stack
        run: |
          set -euo pipefail
          umask 077
          sql_password="Aa1-$(openssl rand -hex 20)"
          rabbitmq_password="$(openssl rand -hex 20)"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$rabbitmq_password"
          {
            printf 'COMMERCE_SQL_PASSWORD=%s\n' "$sql_password"
            printf 'COMMERCE_RABBITMQ_PASSWORD=%s\n' "$rabbitmq_password"
          } > .env

          docker compose up --build --wait --wait-timeout 180

      - name: Create and read an order through the API container
        run: |
          set -euo pipefail
          api=http://127.0.0.1:8080
          curl --fail --silent --show-error --max-time 5 \
            --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 75 \
            "$api/swagger/v1/swagger.json" --output /dev/null

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --fail-with-body --silent --show-error --max-time 20 \
            --output "$response" --write-out '%{http_code}' \
            --json '{"customerName":"Container Smoke","items":[{"productName":"Notebook","quantity":2,"unitPriceAmount":6.50,"unitPriceCurrency":"EUR"}]}' \
            "$api/api/Order")"
          test "$status" = 201
          order_id="$(jq -er 'strings | select(test("^[0-9a-fA-F-]{36}$"))' "$response")"

          curl --fail --silent --show-error --max-time 20 "$api/api/Order/$order_id" |
            jq -e --arg id "$order_id" '
              .id == $id and
              .customerName == "Container Smoke" and
              .currency == "EUR" and
              .totalAmount == 13 and
              (.items | length == 1 and .[0].productName == "Notebook" and .[0].quantity == 2)
            ' > /dev/null

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: |
          if test -f .env; then
            docker compose logs --no-color --tail=120
          fi

      - name: Remove smoke test containers and volumes
        if: ${{ always() }}
        run: |
          if test -f .env; then
            docker compose down --volumes
          fi

  bicep-validate:
     runs-on: ubuntu-latest
     steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if any Bicep files exist
        id: bicepcheck
        run: |
          if find . -name "*.bicep" | grep -q .; then
            echo "has_bicep=true" >> $GITHUB_OUTPUT
          else
            echo "has_bicep=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Azure CLI
        if: ${{ steps.bicepcheck.outputs.has_bicep == 'true' }}
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az version
            az bicep install
            az bicep version
            find . -name "*.bicep" -print -exec az bicep build --file {} \;

